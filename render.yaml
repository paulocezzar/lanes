# Render Blueprint: one web service + one PostgreSQL database.
services:
  - type: web
    name: lanes
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 3 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      - key: SITE_URL
        value: https://lanes.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: lanes-db
          property: connectionString

  # Every 5 minutes, asks the web app to run recurring cards, due reminders,
  # due-date rules and send queued email — so all the settings (email,
  # Microsoft) only need to live on the web service.
  - type: cron
    name: lanes-automations
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 60 -X POST -H "Authorization: Bearer $CRON_TOKEN" "$SITE_URL/internal/run-automations/"
    envVars:
      - key: CRON_TOKEN
        fromService:
          type: web
          name: lanes
          envVarKey: CRON_TOKEN
      - key: SITE_URL
        value: https://lanes.onrender.com

databases:
  - name: lanes-db
    region: frankfurt
    plan: basic-256mb
    databaseName: lanes
