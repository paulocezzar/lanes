{% extends "boards/board_base.html" %}
{% block board_body %}
  <div class="lists" id="lists">
    {% for list in lists %}{% include "boards/_list.html" %}{% endfor %}
    {% if can_edit %}
    <div class="add-list" id="add-list">
      <button class="add-list-btn" data-add-list>{% include "boards/_icon.html" with i="plus" %}Add another list</button>
      <form data-add-list-form hidden>
        <input name="title" placeholder="Enter list name…" maxlength="120" autocomplete="off">
        <div class="row"><button class="btn primary sm">Add list</button><button type="button" class="icon-btn" data-cancel>{% include "boards/_icon.html" with i="close" %}</button></div>
      </form>
    </div>
    {% endif %}
  </div>
{% endblock %}
