{# Board-wide actions (board buttons + scheduled jobs). Needs: p #}
<div data-actions-form>
{% for i in action_slots %}
<div class="auto-line" data-action-row {% if not forloop.first %}hidden{% endif %}>
  <span class="auto-word">{% if forloop.first %}then{% else %}and{% endif %}</span>
  <select name="{{ p }}action_{{ i }}" data-action aria-label="Action">
    {% if not forloop.first %}<option value="">— no more actions —</option>{% endif %}
    {% for k, v in board_actions %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
  </select>
  <input name="{{ p }}text_{{ i }}" maxlength="250" placeholder="Card title" data-param="create_card" data-text>
  <input name="{{ p }}text_{{ i }}" maxlength="120" placeholder="List name" data-param="create_list" data-text>
  <input name="{{ p }}count_{{ i }}" type="number" min="1" max="50" value="2" data-param="move_random" data-count aria-label="How many">
  <select name="{{ p }}from_list_{{ i }}" data-param="move_all move_random" data-from-list aria-label="From list">{% for l in lists %}<option value="{{ l.pk }}">from {{ l.title }}</option>{% endfor %}</select>
  <select name="{{ p }}list_{{ i }}" data-param="create_card move_all sort_due archive_list move_random sort_field" data-list aria-label="List">{% for l in lists %}<option value="{{ l.pk }}">{{ l.title }}</option>{% endfor %}</select>
  <select name="{{ p }}field_{{ i }}" data-param="sort_field" data-field aria-label="Custom field">{% for f in fields %}<option value="{{ f.pk }}">by {{ f.name }}</option>{% empty %}<option value="">no custom fields yet</option>{% endfor %}</select>
  <select name="{{ p }}order_{{ i }}" data-param="sort_field" data-order aria-label="Order"><option value="asc">low to high</option><option value="desc">high to low</option></select>
</div>
{% endfor %}
<button type="button" class="btn ghost sm" data-more-actions>+ Another action</button>
<p class="muted small">Tip: card titles can include the date — <code>Stocktake %d %b</code> becomes “Stocktake 21 Oct”.</p>
</div>
