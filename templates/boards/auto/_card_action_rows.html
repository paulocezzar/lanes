{# Card actions (rules + card buttons). Needs: p (field prefix), word, add_me #}
<div data-actions-form>
{% for i in action_slots %}
<div class="auto-line" data-action-row {% if not forloop.first %}hidden{% endif %}>
  <span class="auto-word">{% if forloop.first %}{{ word }}{% else %}and{% endif %}</span>
  <select name="{{ p }}action_{{ i }}" data-action aria-label="Action">
    {% if not forloop.first %}<option value="">— no more actions —</option>{% endif %}
    {% for k, v in actions %}<option value="{{ k }}">{% if add_me %}{{ v|cut:"it "|cut:"its " }}{% else %}{{ v }}{% endif %}</option>{% endfor %}
    {% if add_me %}<option value="add_me">add the person who pressed it</option>{% endif %}
  </select>
  <select name="{{ p }}list_{{ i }}" data-param="move" data-list aria-label="List">{% for l in lists %}<option value="{{ l.pk }}">{{ l.title }}</option>{% endfor %}</select>
  <select name="{{ p }}label_{{ i }}" data-param="add_label remove_label" data-label aria-label="Label">{% for l in labels %}<option value="{{ l.pk }}" data-colour="{{ l.colour }}">{{ l }}</option>{% endfor %}</select>
  <select name="{{ p }}user_{{ i }}" data-param="add_member" aria-label="Person">{% for u in people %}<option value="{{ u.pk }}">{{ u.display_name }}</option>{% endfor %}</select>
  <input name="{{ p }}days_{{ i }}" type="number" min="0" max="365" value="1" data-param="set_due set_due_workdays" data-days aria-label="Days from now">
  <input name="{{ p }}text_{{ i }}" maxlength="2000" placeholder="Comment text" data-param="comment" data-text>
  <input name="{{ p }}text_{{ i }}" maxlength="250" placeholder="Message (optional)" data-param="notify" data-text>
  <input name="{{ p }}cltitle_{{ i }}" maxlength="120" placeholder="Checklist name" data-param="add_checklist" data-cltitle>
  <textarea name="{{ p }}clitems_{{ i }}" rows="2" placeholder="Items, one per line (optional)" data-param="add_checklist" data-clitems></textarea>
  <select name="{{ p }}sticker_{{ i }}" data-param="add_sticker" data-sticker aria-label="Sticker">{% for s in stickers %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select>
</div>
{% endfor %}
<button type="button" class="btn ghost sm" data-more-actions>+ Another action</button>
</div>
