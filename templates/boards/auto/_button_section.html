{% for row in items %}{% with b=row.b %}
<div class="auto-row">
  <div class="auto-desc">
    <b class="btn-preview"><span class="btn sm">{{ b.icon }} {{ b.name }}</span></b>
    <ul>{% for t in row.does %}<li>{{ t }}</li>{% endfor %}</ul>
    <small class="muted">Pressed {{ b.run_count }} time{{ b.run_count|pluralize }}</small>
  </div>
  {% if can_edit %}
  <form method="post" action="{% url 'button_update' board.pk b.pk %}" data-confirm="Delete this button?" data-confirm-ok="Delete" data-danger>{% csrf_token %}<input type="hidden" name="section" value="{{ section }}">
    <input type="hidden" name="action" value="delete"><button class="icon-btn xs" title="Delete">{% include "boards/_icon.html" with i="close" %}</button>
  </form>
  {% endif %}
</div>
{% endwith %}{% endfor %}
