{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading }} · Lanes</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'lanes/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'lanes/app.css' %}">
  <style>
    .err-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text, #dee4ea); }
    .err-card { max-width: 440px; width: 100%; text-align: center; background: var(--surface); border-radius: 12px; padding: 36px 28px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .err-card .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; margin-bottom: 20px; color: inherit; text-decoration: none; }
    .err-card h1 { font-size: 22px; margin: 0 0 10px; }
    .err-card p { margin: 0 0 22px; opacity: .8; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="err-wrap">
    <div class="err-card">
      <a class="brand" href="/">{% include "_logo.html" %}Lanes</a>
      <h1>{{ heading }}</h1>
      <p>{{ message }}</p>
      <a class="btn primary" href="/">Go to your boards</a>
    </div>
  </main>
</body>
</html>
